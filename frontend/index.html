<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LearnIQ | Adaptive Learning</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="welcome-page">

        <div class="background-shape shape-one"></div>
        <div class="background-shape shape-two"></div>


        <section class="welcome-card">

            <!-- LOGO -->

            <div class="logo">

                <span class="logo-icon">✦</span>

                <span>LearnIQ</span>

            </div>


            <!-- MAIN CONTENT -->

            <div class="welcome-content">

                <div class="welcome-badge">

                    ✨ Learn at your own pace

                </div>


                <h1>

                    Learning that
                    <br>

                    <span>adapts to you.</span>

                </h1>


                <p class="welcome-description">

                    Your level. Your pace.
                    Your way of learning.

                </p>


                <!-- NAME -->

                <div class="name-section">

                    <label for="studentName">

                        👋 What should we call you?

                    </label>


                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter your name"
                    >


                    <p class="nickname-text">

                        You can use a nickname too 😊

                    </p>


                    <button
                        class="primary-btn"
                        onclick="continueToStyle()"
                    >

                        Continue

                        <span>→</span>

                    </button>


                    <p
                        id="errorMessage"
                        class="error-message"
                    ></p>

                </div>

            </div>

        </section>


        <footer>

            Built for smarter, more personalized learning

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
