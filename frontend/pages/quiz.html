<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Diagnostic Quiz | LearnIQ</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

<main class="quiz-page">


    <!-- HEADER -->

    <div class="page-header">

        <div class="logo">

            <span class="logo-icon">✦</span>

            <span>LearnIQ</span>

        </div>

        <div class="step-indicator">

            4 of 5

        </div>

    </div>



    <!-- QUIZ CONTENT -->

    <section class="quiz-content">


        <div class="welcome-badge">

            🧠 Quick check

        </div>


        <h1>

            Let's understand<br>

            <span>what you already know.</span>

        </h1>


        <p class="section-description">

            Answer these questions at your own pace.
            There is no pressure to get everything right.

        </p>



        <!-- PROGRESS -->

        <div class="quiz-progress-area">

            <div class="quiz-progress-top">

                <span id="questionNumber">

                    Question 1 of 10

                </span>

                <span id="progressPercent">

                    10%

                </span>

            </div>


            <div class="quiz-progress-bar">

                <div
                    id="quizProgress"
                    class="quiz-progress-fill"
                ></div>

            </div>

        </div>



        <!-- QUESTION CARD -->

        <div class="question-card">


            <div
                id="questionText"
                class="question-text"
            >

                Question will appear here

            </div>


            <div
                id="optionsContainer"
                class="options-container"
            >

            </div>


            <p
                id="answerMessage"
                class="answer-message"
            ></p>


            <button
                id="nextButton"
                class="primary-btn"
                onclick="nextQuestion()"
                disabled
            >

                Next →

            </button>


        </div>


    </section>


</main>



<script>

const questions = [

    {
        question: "What is the value of sin 30°?",
        options: ["0", "1/2", "1", "√3/2"],
        answer: "1/2"
    },

    {
        question: "What is the value of cos 60°?",
        options: ["0", "1/2", "1", "√3/2"],
        answer: "1/2"
    },

    {
        question: "What is the value of tan 45°?",
        options: ["0", "1/2", "1", "√3"],
        answer: "1"
    },

    {
        question: "Which identity is correct?",
        options: [
            "sin²θ + cos²θ = 1",
            "sinθ + cosθ = 1",
            "sin²θ - cos²θ = 1",
            "tanθ + cosθ = 1"
        ],
        answer: "sin²θ + cos²θ = 1"
    },

    {
        question: "What is sin 90°?",
        options: ["0", "1/2", "1", "√3/2"],
        answer: "1"
    },

    {
        question: "What is cos 0°?",
        options: ["0", "1/2", "1", "√3/2"],
        answer: "1"
    },

    {
        question: "If tan θ = 1, what is θ?",
        options: ["30°", "45°", "60°", "90°"],
        answer: "45°"
    },

    {
        question: "What is the value of sin 60°?",
        options: ["1/2", "1", "√3/2", "0"],
        answer: "√3/2"
    },

    {
        question: "What is the value of cos 30°?",
        options: ["1/2", "1", "√3/2", "0"],
        answer: "√3/2"
    },

    {
        question: "Which formula represents tan θ?",
        options: [
            "sin θ / cos θ",
            "cos θ / sin θ",
            "sin θ × cos θ",
            "1 / sin θ"
        ],
        answer: "sin θ / cos θ"
    }

];


let currentQuestion = 0;

let score = 0;

let selectedAnswer = "";



function loadQuestion() {

    const question = questions[currentQuestion];


    document.getElementById("questionText").textContent =
        question.question;


    document.getElementById("questionNumber").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    const percentage =
        ((currentQuestion + 1) / questions.length) * 100;


    document.getElementById("progressPercent").textContent =
        percentage + "%";


    document.getElementById("quizProgress").style.width =
        percentage + "%";


    const container =
        document.getElementById("optionsContainer");


    container.innerHTML = "";


    selectedAnswer = "";


    document.getElementById("nextButton").disabled = true;


    document.getElementById("answerMessage").textContent = "";


    question.options.forEach(function(option) {

        const button =
            document.createElement("button");


        button.className = "option-button";


        button.textContent = option;


        button.onclick = function() {

            selectAnswer(button, option);

        };


        container.appendChild(button);

    });

}



function selectAnswer(button, answer) {

    document
        .querySelectorAll(".option-button")
        .forEach(function(item) {

            item.classList.remove("selected");

        });


    button.classList.add("selected");


    selectedAnswer = answer;


    document.getElementById("nextButton").disabled = false;

}



function nextQuestion() {

    if (selectedAnswer === "") {

        return;

    }


    const correctAnswer =
        questions[currentQuestion].answer;


    if (selectedAnswer === correctAnswer) {

        score++;

    }


    currentQuestion++;


    if (currentQuestion < questions.length) {

        loadQuestion();

    }

    else {

        finishQuiz();

    }

}



function finishQuiz() {

    const percentage =
        (score / questions.length) * 100;

    let level;

    if (percentage < 50) {
        level = "Beginner";
    }
    else if (percentage < 80) {
        level = "Intermediate";
    }
    else {
        level = "Advanced";
    }

    // Save diagnostic result
    localStorage.setItem("diagnosticScore", percentage);
    localStorage.setItem("learningLevel", level);

    // Check that it was saved
    console.log("Diagnostic Score:", percentage);
    console.log("Learning Level:", level);
    console.log(
        "Saved Level:",
        localStorage.getItem("learningLevel")
    );

    window.location.href = "level.html";
}
loadQuestion();
</script>

</body>

</html>
