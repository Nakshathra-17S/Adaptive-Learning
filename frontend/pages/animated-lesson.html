<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7ff;
    color: #18213d;
}

.page {
    min-height: 100vh;
    padding: 25px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    margin: auto;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.points {
    background: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
}

.personalization {
    background: white;
    padding: 15px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.lesson-card {
    background: white;
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.progress-area {
    margin-bottom: 25px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
}

.progress {
    height: 10px;
    background: #e4e8f5;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 25%;
    background: #6c63ff;
    transition: width 0.5s;
}

.animation-box {
    height: 270px;
    background: #eef1ff;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
    overflow: hidden;
}

.triangle {
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-bottom: 180px solid #6c63ff;
    animation: floatTriangle 2s infinite ease-in-out;
}

@keyframes floatTriangle {

    0% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-20px) rotate(5deg);
    }

    100% {
        transform: translateY(0) rotate(0deg);
    }

}

.lesson-number {
    color: #6c63ff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
}

h1 {
    font-size: 36px;
    margin: 10px 0;
}

.subtitle {
    font-size: 18px;
    color: #68708a;
    margin-bottom: 20px;
}

.explanation {
    font-size: 17px;
    line-height: 1.7;
    background: #f7f8ff;
    padding: 20px;
    border-radius: 15px;
}

.formula {
    margin-top: 20px;
    padding: 20px;
    background: #fff7df;
    border-radius: 15px;
}

.formula strong {
    font-size: 22px;
}

.example {
    margin-top: 20px;
    padding: 20px;
    background: #eefaf2;
    border-radius: 15px;
}

.controls {
    display: flex;
    gap: 15px;
    margin-top: 30px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

.listen {
    background: #eef1ff;
    color: #4d46c7;
}

.stop {
    background: #ffecec;
    color: #d94b4b;
}

.next {
    background: #6c63ff;
    color: white;
    margin-left: auto;
}

.complete {
    display: none;
    text-align: center;
    padding: 60px 20px;
}

.complete-icon {
    font-size: 70px;
}

.complete h1 {
    color: #6c63ff;
}

.continue-btn {
    margin-top: 25px;
    background: #6c63ff;
    color: white;
}

</style>

/* =========================

========================= */

learningStyle + "-" + learningLevel;

lessonLibrary[key];


/* FALLBACK */

if (!lessons) {

    lessons =
    lessonLibrary["Visualizer-Beginner"];

}


/* =========================
   LESSON STATE
========================= */

let currentLesson = 0;

let points = 10;


/* =========================
   LOAD LESSON
========================= */

function loadLesson() {

    const lesson =
    lessons[currentLesson];

    document.getElementById("lessonNumber").textContent =
    "LESSON " + (currentLesson + 1);

    document.getElementById("progressText").textContent =
    (currentLesson + 1) + " / " + lessons.length;

    document.getElementById("progressBar").style.width =
    ((currentLesson + 1) / lessons.length * 100) + "%";

    document.getElementById("lessonTitle").textContent =
    lesson.title;

    document.getElementById("lessonSubtitle").textContent =
    lesson.subtitle;

    document.getElementById("lessonExplanation").textContent =
    lesson.explanation;

    document.getElementById("formula").textContent =
    lesson.formula;

    document.getElementById("exampleQuestion").textContent =
    lesson.question;

    document.getElementById("exampleAnswer").textContent =
    "Answer: " + lesson.answer;

    document.getElementById("points").textContent =
    points;

    if (currentLesson === lessons.length - 1) {

        document.getElementById("nextButton").textContent =
        "Complete Lesson ✓";

    }

}


/* =========================
   NEXT
========================= */

function nextLesson() {

    stopSpeech();

    points += 20;

    if (currentLesson < lessons.length - 1) {

        currentLesson++;

        loadLesson();

    }

    else {

        completeLesson();

    }

}


/* =========================
   COMPLETE
========================= */

function completeLesson() {

    document.getElementById("lessonCard").style.display =
    "none";

    document.getElementById("completeCard").style.display =
    "block";

    document.getElementById("finalPoints").textContent =
    points;

}

    lesson.answer;

    new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 0.9;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

}


function stopSpeech() {

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

    }

}
